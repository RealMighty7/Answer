<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access</title>

  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          connect-src 'self' https://riddle-verify.2nlindauer.workers.dev;
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          base-uri 'self';
          form-action 'self';
        ">

  <style>
    :root { color-scheme: dark; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: radial-gradient(1200px 800px at 50% 30%, #1d2330, #0b0f16);
      color:#e8eefc;
    }
    .card{
      width:min(460px, calc(100% - 32px));
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
    }
    h1{ margin:0 0 8px; font-size:20px; font-weight:800; letter-spacing:0.2px; }
    p{ margin:0 0 18px; opacity:0.85; line-height:1.35; }
    label{ display:block; font-size:13px; opacity:0.9; margin-bottom:8px; }
    input{
      width:100%; box-sizing:border-box;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.25);
      color:#e8eefc;
      outline:none;
      font-size: 15px;
    }
    input:focus{ border-color: rgba(120,170,255,0.8); }
    .row{ display:flex; gap:10px; margin-top:12px; align-items:center; }
    button{
      flex:1;
      padding: 12px 14px;
      border:0;
      border-radius: 12px;
      background: linear-gradient(180deg, #4b7bff, #2f5cff);
      color:white;
      font-weight:800;
      cursor:pointer;
    }
    button:disabled{ opacity:0.6; cursor:not-allowed; }
    .msg{ margin-top:12px; min-height:18px; font-size:13px; opacity:0.92; }
    .shake{ animation: shake 0.25s linear 0s 2; }
    @keyframes shake{
      0%{ transform:translateX(0); }
      25%{ transform:translateX(-6px); }
      50%{ transform:translateX(6px); }
      75%{ transform:translateX(-6px); }
      100%{ transform:translateX(0); }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Enter Password</h1>
    <p>Spacing, capitalization, and punctuation don’t matter.</p>

    <form id="f" autocomplete="off">
      <label for="p">Password</label>
      <input id="p" type="password" inputmode="text" spellcheck="false" autofocus />
      <div class="row">
        <button id="b" type="submit">Unlock</button>
      </div>
      <div class="msg" id="m" aria-live="polite"></div>
    </form>
  </div>

  <script>
    const E = "https://riddle-verify.2nlindauer.workers.dev/check-access";
    const f = document.getElementById("f");
    const p = document.getElementById("p");
    const m = document.getElementById("m");
    const c = document.getElementById("card");
    const b = document.getElementById("b");

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const canon = (s) => (s ?? "")
      .toString()
      .trim()
      .toLowerCase()
      .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "");

    function shake(t){
      m.textContent = t;
      c.classList.remove("shake");
      void c.offsetWidth;
      c.classList.add("shake");
      p.select();
    }

    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const raw = p.value;
      const v = canon(raw);
      if (!v) { shake("Enter something."); return; }

      b.disabled = true;
      m.textContent = "Checking…";
      await sleep(140 + Math.floor(Math.random() * 160));

      try{
        const res = await fetch(E, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ guess: raw })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data && data.ok) {
          m.textContent = "Unlocked.";
          await sleep(200);
          location.href = data.redirect || "https://realmighty7.github.io/RiddleMeThis/";
          return;
        }

        b.disabled = false;
        shake("Incorrect.");
      } catch {
        b.disabled = false;
        shake("Network error.");
      }
    });
  </script>
</body>
</html>
