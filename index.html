<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Check</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: radial-gradient(1200px 800px at 50% 30%, #1d2330, #0b0f16);
      color:#e8eefc;
    }
    .card{
      width:min(460px, calc(100% - 32px));
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
    }
    h1{ margin:0 0 8px; font-size:20px; font-weight:800; letter-spacing:0.2px; }
    p{ margin:0 0 18px; opacity:0.85; line-height:1.35; }
    label{ display:block; font-size:13px; opacity:0.9; margin-bottom:8px; }
    input{
      width:100%; box-sizing:border-box;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.25);
      color:#e8eefc;
      outline:none;
      font-size: 15px;
    }
    input:focus{ border-color: rgba(120,170,255,0.8); }
    .row{ display:flex; gap:10px; margin-top:12px; align-items:center; }
    button{
      flex:1;
      padding: 12px 14px;
      border:0;
      border-radius: 12px;
      background: linear-gradient(180deg, #4b7bff, #2f5cff);
      color:white;
      font-weight:800;
      cursor:pointer;
    }
    button:disabled{ opacity:0.6; cursor:not-allowed; }
    .msg{ margin-top:12px; min-height:18px; font-size:13px; opacity:0.92; }
    .hint{ margin-top:10px; font-size:12px; opacity:0.55; }
    .shake{ animation: shake 0.25s linear 0s 2; }
    @keyframes shake{
      0%{ transform:translateX(0); }
      25%{ transform:translateX(-6px); }
      50%{ transform:translateX(6px); }
      75%{ transform:translateX(-6px); }
      100%{ transform:translateX(0); }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Enter Password</h1>
    <p>Spacing, capitalization, and punctuation don’t matter.</p>

    <form id="pwForm" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" type="password" inputmode="text" spellcheck="false" autofocus />

      <div class="row">
        <button id="btn" type="submit">Unlock</button>
      </div>

      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="hint">If you’re close, try removing punctuation or changing separators.</div>
    </form>
  </div>

  <script>
    // Your Cloudflare Worker endpoint (you’ll create this)
    const VERIFY_ENDPOINT = "https://YOUR-WORKER.your-subdomain.workers.dev/verify";

    const form = document.getElementById("pwForm");
    const input = document.getElementById("password");
    const msg = document.getElementById("msg");
    const card = document.getElementById("card");
    const btn = document.getElementById("btn");

    function shake(text){
      msg.textContent = text;
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      input.select();
    }

    function normalizeAnswer(s){
      s = (s ?? "").toString().trim().toLowerCase();
      s = s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
      s = s.replace(/[^a-z0-9]+/g, "");
      return s;
    }

    let attempts = 0;
    let lockUntil = 0;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const now = Date.now();
      if (now < lockUntil) {
        const secs = Math.ceil((lockUntil - now) / 1000);
        shake(`Try again in ${secs}s.`);
        return;
      }

      btn.disabled = true;
      msg.textContent = "Checking…";

      await new Promise(r => setTimeout(r, 120 + Math.floor(Math.random() * 140)));

      const normalized = normalizeAnswer(input.value);
      const looksEmpty = normalized.length === 0;
      const looksTooShort = normalized.length > 0 && normalized.length < 4;

      if (looksEmpty) { btn.disabled = false; shake("Enter something first."); return; }
      if (looksTooShort) { btn.disabled = false; shake("Too short."); return; }

      try {
        const res = await fetch(VERIFY_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ a: normalized })
        });

        // 200 => ok (worker can return redirect URL as JSON)
        if (res.ok) {
          const data = await res.json().catch(() => ({}));
          const redirectTo = data?.redirect || "https://realmighty7.github.io/RiddleMeThis/";
          msg.textContent = "Unlocked. Redirecting…";
          await new Promise(r => setTimeout(r, 250));
          window.location.href = redirectTo;
          return;
        }

        // 429 => rate-limited
        if (res.status === 429) {
          const data = await res.json().catch(() => ({}));
          const secs = data?.retryAfter ?? 15;
          lockUntil = Date.now() + (secs * 1000);
          btn.disabled = false;
          shake(`Try again in ${secs}s.`);
          return;
        }

        // otherwise incorrect
        attempts++;
        btn.disabled = false;

        if (attempts % 6 === 0) lockUntil = Date.now() + 15000;

        const lines = ["Incorrect.", "Not quite.", "That doesn’t match.", "Try a different form of it."];
        shake(lines[Math.floor(Math.random() * lines.length)]);
      } catch (err) {
        btn.disabled = false;
        shake("Network error. Try again.");
      }
    });
  </script>
</body>
</html>
